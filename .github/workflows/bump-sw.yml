name: Bump SW cache version

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/sw.js'   # prevent re-trigger when this workflow commits sw.js

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update SW cache version with current timestamp
        run: |
          TS=$(date +%s)
          sed -i "s/const CACHE *= *'bms-app-v[^']*'/const CACHE      = 'bms-app-v$TS'/" docs/sw.js
          sed -i "s/const IMG_CACHE *= *'bms-img-v[^']*'/const IMG_CACHE  = 'bms-img-v$TS'/" docs/sw.js

      - name: Commit updated sw.js
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/sw.js
          git diff --staged --quiet || git commit -m "chore: bump SW cache version [skip ci]"
          git push
