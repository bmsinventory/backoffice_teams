<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BMS Training System</title>
<!--
  ระบบอบรม — หน้าเดียว 4 ส่วน (ตัวเลือกส่วนและ style/script ของแต่ละส่วนอยู่ที่ src/utils/training-page.util.js)
    /training/?site=รหัส รพ.               หน้าผู้เข้าอบรม: ลงทะเบียน · ตรวจสอบการลงทะเบียน (ดู QR)  → <template id="trn-page-app">
                                           (งานผู้ดูแลทั้งหมดเปิดผ่าน Backoffice — iframe ?embed=1 ซ่อนแถบเมนูนี้)
    /training/?page=survey&site=รหัส รพ.   แบบประเมินหลังอบรม                                   → <template id="trn-page-survey">
    /training/?page=quiz&site=รหัส[&cat=]   แบบทดสอบหลังอบรม · ?page=quiz&cert=เลขที่ = ดูใบประกาศ  → <template id="trn-page-quiz">
    /training/?page=manual                 คู่มือการใช้งาน                                       → <template id="trn-page-manual">
-->

<!-- PWA -->
<link rel="manifest" id="pwa-manifest-link" href="../manifest-training.json">
<meta name="theme-color" content="#7c5cfc">
<link rel="icon" type="image/png" sizes="192x192" href="../img/training/icon-192.png">
<link rel="apple-touch-icon" href="../img/training/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BMS Training">

<!-- สี/ฟอนต์/โหมดมืด ชุดเดียวกับ Backoffice (ค่าสีอยู่ที่ src/styles/variables.css ไฟล์เดียว) -->
<script src="../src/utils/theme.util.js"></script>
<script src="../src/utils/training-embed.util.js"></script>
<link rel="stylesheet" href="../src/styles/variables.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="../src/utils/training-page.util.js"></script>
</head>
<body>

<!-- ═══════════ หน้าหลัก (ลงทะเบียน · เช็คชื่อ · Analytics · ผู้ดูแล) — src/modules/training-app.js · training.css ═══════════ -->
<template id="trn-page-app">
<!-- App Loading -->
<div id="app-loading">
  <div class="app-loading-spinner"></div>
  <div class="app-loading-text"><i class="ti ti-building-warehouse"></i> BMS Training</div>
  <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">กำลังโหลดข้อมูล...</div>
</div>

<nav class="nav">
  <div class="nav-brand">
    <i class="ti ti-building-hospital"></i>
    <span>BMS Training</span>
    <span class="nav-brand-dot"></span>
    <span class="nav-site-badge" id="nav-site-badge"></span>
  </div>
  <!-- หน้าผู้เข้าอบรม: ลงทะเบียน + ตรวจสอบการลงทะเบียน (ดู QR ซ้ำได้) — งานผู้ดูแลอยู่ที่ Backoffice -->
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('register')" id="tab-register">
      <i class="ti ti-pencil-plus"></i><span>ลงทะเบียน</span>
    </button>
    <button class="nav-tab" onclick="showPage('track')" id="tab-track">
      <i class="ti ti-user-search"></i><span>ตรวจสอบการลงทะเบียน</span>
    </button>
  </div>
</nav>

<!-- Offline / Update banners -->
<div class="pwa-banner offline" id="offline-banner">
  <i class="ti ti-wifi-off"></i>
  <span>ออฟไลน์ — ไม่มีการเชื่อมต่ออินเทอร์เน็ต ข้อมูลบางส่วนอาจไม่เป็นปัจจุบัน</span>
</div>
<div class="pwa-banner update" id="update-banner">
  <i class="ti ti-refresh"></i>
  <span>มีเวอร์ชันใหม่ของระบบ</span>
  <button onclick="pwaApplyUpdate()">อัปเดตเลย</button>
</div>

<!-- ═══ REGISTER ═══ -->
<div class="page active" id="page-register">
  <div class="step-bar">
    <div class="step active" id="step1"><div class="step-num">1</div><div class="step-label">เลือกหลักสูตร</div></div>
    <div class="step-line" id="line1"><span></span></div>
    <div class="step" id="step2"><div class="step-num">2</div><div class="step-label">เลือกรอบอบรม</div></div>
    <div class="step-line" id="line2"><span></span></div>
    <div class="step" id="step3"><div class="step-num">3</div><div class="step-label">กรอกข้อมูล</div></div>
  </div>
  <div id="view-categories">
    <!-- Hero หน้าเลือกหลักสูตร — ตัวเลขสรุปเติมโดย renderCatHero() -->
    <div class="reg-hero">
      <div class="reg-hero-bg"><span class="reg-orb o1"></span><span class="reg-orb o2"></span><span class="reg-orb o3"></span><span class="reg-grid"></span></div>
      <div class="reg-hero-body">
        <div class="reg-hero-text">
          <span class="reg-hero-eyebrow"><span class="reg-live-dot"></span>เปิดรับลงทะเบียน</span>
          <h2 class="reg-hero-title">หลักสูตรอบรม<span class="reg-hero-site" id="reg-hero-site"></span></h2>
          <p class="reg-hero-sub">เลือกหลักสูตรที่ต้องการ แล้วเลือกรอบและกรอกข้อมูลเพื่อลงทะเบียน — รับ QR Code เข้าอบรมทันที</p>
        </div>
        <div class="reg-hero-stats" id="reg-hero-stats"></div>
      </div>
    </div>
    <div class="cat-search-bar">
      <div class="cat-search-wrap">
        <i class="ti ti-search"></i>
        <input type="text" id="cat-search" class="cat-search-input" placeholder="ค้นหาหลักสูตร..." oninput="filterCats()" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')">
      </div>
      <div class="cat-filter-pills" id="cat-status-pills">
        <button class="cat-filter-pill active" onclick="setCatFilter('all',this)"><i class="ti ti-layout-grid"></i>ทั้งหมด</button>
        <button class="cat-filter-pill" onclick="setCatFilter('avail',this)"><i class="ti ti-circle-check"></i>มีที่ว่าง</button>
        <button class="cat-filter-pill" onclick="setCatFilter('near',this)"><i class="ti ti-alert-circle"></i>ใกล้เต็ม</button>
        <button class="cat-filter-pill" onclick="setCatFilter('full',this)"><i class="ti ti-lock"></i>เต็มแล้ว</button>
      </div>
    </div>
    <div class="cat-grid" id="cat-grid"></div>
    <div class="cat-empty" id="cat-empty">
      <i class="ti ti-search-off"></i>
      <p id="cat-empty-msg">ไม่พบหลักสูตรที่ค้นหา</p>
    </div>
  </div>
  <div id="view-sessions" style="display:none;">
    <!-- Hero ของหลักสูตรที่เลือก — renderSessHero() -->
    <div class="sess-hero" id="sess-hero"></div>
    <div class="sess-toolbar">
      <div class="cat-filter-pills" id="sess-filters">
        <button class="cat-filter-pill active" onclick="filterSess('all',this)"><i class="ti ti-layout-grid"></i>ทั้งหมด</button>
        <button class="cat-filter-pill" onclick="filterSess('avail',this)"><i class="ti ti-circle-check"></i>มีที่ว่าง</button>
        <button class="cat-filter-pill" onclick="filterSess('full',this)"><i class="ti ti-lock"></i>เต็มแล้ว</button>
      </div>
      <label class="sess-toggle">
        <input type="checkbox" id="sess-show-full" onchange="renderSessionList()">
        <span class="sess-toggle-ui"></span>แสดงรอบที่เต็มแล้ว
      </label>
    </div>
    <div class="session-list" id="session-list"></div>
  </div>
</div>

<!-- ═══ CHECKIN (รวมเช็คชื่อ + Scan QR) ═══ -->
<div class="page" id="page-checkin">

  <!-- Page Hero -->
  <div class="checkin-hero">
    <div class="checkin-hero-left">
      <div class="hero-icon-wrap"><i class="ti ti-scan"></i></div>
      <div>
        <div class="hero-title">เช็คชื่อผู้เข้าอบรม</div>
        <div class="hero-sub">สแกน QR Code หรือติ๊กชื่อจากรายการ</div>
      </div>
    </div>
    <div id="checkin-live-stats" class="hero-stats"></div>
  </div>

  <!-- Sub-tabs inside checkin page -->
  <div class="checkin-toolbar">
    <div class="checkin-subtabs">
      <button class="checkin-subtab active" onclick="switchCheckinTab('scan',this)" id="subtab-scan">
        <i class="ti ti-qrcode"></i>
        <span>Scan QR</span>
      </button>
      <button class="checkin-subtab" onclick="switchCheckinTab('list',this)" id="subtab-list">
        <i class="ti ti-list-check"></i>
        <span>รายชื่อ</span>
      </button>
    </div>
    <!-- ตัวเลือกรอบ (แสดงเฉพาะแท็บรายชื่อ) -->
    <div class="att-filter-bar">
      <div class="att-filter-field"><i class="ti ti-books"></i>
        <select id="att-cat-sel" onchange="attFilterCat()" title="หลักสูตรอบรม"><option value="">ทุกหลักสูตร</option></select>
      </div>
      <div class="att-filter-field"><i class="ti ti-calendar-event"></i>
        <select id="att-sess-sel" onchange="loadAttendance()" title="รอบอบรม"><option value="">เลือกรอบ...</option></select>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="exportAttendance()" title="Export Excel (.xlsx)">
        <i class="ti ti-file-spreadsheet"></i>Excel
      </button>
    </div>
  </div>

  <!-- ── SUB: SCAN ── -->
  <div class="checkin-sub active" id="csub-scan">
    <div class="scan-area">
      <!-- compact top bar: status + manual entry -->
      <div class="scan-topbar">
        <div class="scan-topbar-status">
          <div id="scan-status-dot" class="status-dot offline"></div>
          <span id="scan-status-txt">กล้องปิดอยู่</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="manualCheckIn()">
          <i class="ti ti-keyboard"></i>พิมพ์ชื่อ
        </button>
        <button class="btn btn-sm" onclick="openWalkinModal(parseInt(document.getElementById('att-sess-sel')?.value)||0)" style="background:#7c3aed;color:#fff;border:none;gap:5px;">
          <i class="ti ti-walk"></i>Walk-in
        </button>
      </div>
      <!-- camera view -->
      <div class="cam-wrap">
        <video id="scanner-video" autoplay playsinline muted></video>
        <!-- scan frame overlay (shown when active) -->
        <div class="scan-overlay" id="scan-overlay" style="display:none;">
          <div class="scan-frame"><div class="scan-line"></div></div>
        </div>
        <!-- idle screen (covers camera when off) -->
        <div class="scan-idle" id="scan-idle">
          <div class="scan-idle-icon-big"><i class="ti ti-qrcode"></i></div>
          <div class="scan-idle-txt">ส่อง QR Code ของผู้เข้าอบรม</div>
          <div class="scan-idle-hint">สแกนแล้วบันทึกทันที — ไม่ต้องเลือกรอบ</div>
          <button class="scan-start-btn" id="btn-start-scan" onclick="startScan()">
            <i class="ti ti-camera"></i>เปิดกล้องสแกน
          </button>
        </div>
        <!-- floating controls at bottom (shown when camera is on) -->
        <div class="scan-cam-controls">
          <button class="scan-ctrl-btn" id="btn-switch-cam" onclick="toggleCamera()" style="display:none;">
            <i class="ti ti-refresh"></i>สลับกล้อง
          </button>
          <button class="scan-ctrl-btn scan-ctrl-stop" id="btn-stop-scan" onclick="stopScan()" style="display:none;">
            <i class="ti ti-camera-off"></i>ปิดกล้อง
          </button>
        </div>
      </div>
    </div>

    <!-- Scan Result -->
    <div id="scan-result-area"></div>

    <!-- Scan Log -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><i class="ti ti-history"></i>ประวัติการสแกนวันนี้</div>
        <button class="btn btn-ghost btn-sm" onclick="clearScanLog()"><i class="ti ti-trash"></i>ล้าง</button>
      </div>
      <div id="scan-log-list">
        <div class="empty" style="padding:24px;">
          <i class="ti ti-wave-sine" style="font-size:32px;display:block;margin-bottom:8px;opacity:.3;"></i>
          <p>ยังไม่มีการสแกน</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ── SUB: LIST ── -->
  <div class="checkin-sub" id="csub-list">
    <div id="att-content">
      <div class="empty"><i class="ti ti-calendar-search" style="font-size:40px;display:block;margin-bottom:10px;opacity:.35;"></i><p>เลือกรอบอบรมเพื่อดูรายชื่อ</p></div>
    </div>
  </div>

</div>

<!-- ═══ TRACK ═══ -->
<div class="page" id="page-track">
  <!-- Hero ตรวจสอบการลงทะเบียน — ตัวเลขสรุปเติมโดย renderTrackHero() -->
  <div class="reg-hero tk-hero">
    <div class="reg-hero-bg"><span class="reg-orb o1"></span><span class="reg-orb o2"></span><span class="reg-orb o3"></span><span class="reg-grid"></span></div>
    <div class="reg-hero-body">
      <div class="reg-hero-text">
        <span class="reg-hero-eyebrow"><i class="ti ti-qrcode"></i>ดู QR Code เช็คชื่อได้ตลอด</span>
        <h2 class="reg-hero-title">ตรวจสอบการลงทะเบียน</h2>
        <p class="reg-hero-sub">ค้นหาชื่อของคุณเพื่อดู QR Code สำหรับเช็คชื่อเข้าอบรม แก้ไขข้อมูล หรือตรวจสอบว่าลงทะเบียนรอบไหนไว้</p>
      </div>
      <div class="reg-hero-stats" id="track-hero-stats"></div>
    </div>
  </div>
  <div class="tk-panel">
    <div class="tk-search">
      <div class="tk-field tk-field-main"><i class="ti ti-search"></i><input id="track-name" placeholder="พิมพ์ชื่อ หรือ นามสกุล..." oninput="trackSearch()" autocomplete="off"></div>
      <div class="tk-field"><i class="ti ti-briefcase"></i><input id="track-pos" placeholder="ตำแหน่ง..." oninput="trackSearch()" autocomplete="off"></div>
    </div>
    <div class="tk-filters">
      <div class="tk-field tk-select"><i class="ti ti-books"></i><select id="track-cat" aria-label="หลักสูตรอบรม" onchange="onTrackCatChange()"><option value="">ทุกหลักสูตร</option></select></div>
      <div class="tk-field tk-select"><i class="ti ti-calendar-event"></i><select id="track-sess" aria-label="รอบอบรม" onchange="trackSearch()"><option value="">ทุกรอบ</option></select></div>
      <button class="tk-clear" onclick="clearTrack()" title="ล้างตัวกรอง"><i class="ti ti-filter-off"></i><span>ล้างตัวกรอง</span></button>
    </div>
  </div>
  <div id="track-results"></div>
</div>

<!-- ═══ ANALYTICS ═══ -->
<div class="page" id="page-analytics">
  <div class="section-header">
    <div class="section-title"><i class="ti ti-chart-dots"></i>Analytics</div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary btn-sm" onclick="trnAiAnalytics()" style="gap:6px;" title="ให้ AI สรุปสถานะการอบรมของโครงการ (src/modules/training-ai.js)">
        <i class="ti ti-sparkles"></i>สรุปด้วย AI
      </button>
      <button class="btn btn-primary btn-sm" onclick="trnAiFollowNoReg()" style="gap:6px;" title="ให้ AI ร่างข้อความติดตามหน่วยงานที่ยังไม่ลงทะเบียน (src/modules/training-ai.js)">
        <i class="ti ti-sparkles"></i>ร่างข้อความตามด้วย AI
      </button>
      <button class="btn btn-success btn-sm" onclick="exportAllRegsExcel()" style="gap:6px;">
        <i class="ti ti-file-spreadsheet"></i>Export Excel
      </button>
    </div>
  </div>

  <!-- KPI ทุกมิติ (การจัด · การเข้าร่วม · ความครอบคลุม · คุณภาพ · ความพร้อมใช้งาน) — renderAnalytics() -->
  <div id="analytics-summary" class="an-kpis"></div>

  <!-- Row 1: Scorecard ทุกมิติ + Donut -->
  <div class="an-row an-row-score">
    <div class="card an-card">
      <div class="an-card-head">
        <div class="card-title"><i class="ti ti-target-arrow"></i>Scorecard ทุกมิติ</div>
        <span id="analytics-score-total" class="an-head-note"></span>
      </div>
      <div id="analytics-scorecard"></div>
    </div>
    <div class="card an-card">
      <div class="card-title an-title"><i class="ti ti-chart-donut-3"></i>สถานะผู้ลงทะเบียน</div>
      <div style="position:relative;height:240px;"><canvas id="chart-overall"></canvas></div>
    </div>
  </div>

  <!-- Row 2: หลักสูตรอบรม + ผลประเมินรายด้าน -->
  <div class="an-row">
    <div class="card an-card">
      <div class="card-title an-title"><i class="ti ti-category"></i>แยกตามหลักสูตรอบรม</div>
      <div style="position:relative;height:240px;"><canvas id="chart-by-cat"></canvas></div>
    </div>
    <div class="card an-card">
      <div class="an-card-head">
        <div class="card-title"><i class="ti ti-star"></i>ผลประเมินความพึงพอใจรายด้าน</div>
        <span id="analytics-survey-note" class="an-head-note"></span>
      </div>
      <div id="analytics-survey-sec"></div>
    </div>
  </div>

  <!-- Row 3: รายหน่วยงาน (ทุกมิติ) -->
  <div class="card an-card">
    <div class="an-card-head">
      <div class="card-title"><i class="ti ti-building"></i>สรุปรายหน่วยงาน (ทุกมิติ)</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span id="analytics-dept-total" class="an-head-note"></span>
        <input class="form-control" id="an-dept-q" placeholder="ค้นหาหน่วยงาน" style="width:170px;height:32px;font-size:12px;" oninput="renderAnalyticsDeptTable()">
        <select class="form-control" id="an-dept-f" style="width:auto;height:32px;font-size:12px;" onchange="renderAnalyticsDeptTable()">
          <option value="">ทุกหน่วยงาน</option><option value="issue">เฉพาะที่ต้องติดตาม</option><option value="ok">พร้อมแล้ว</option>
        </select>
      </div>
    </div>
    <div id="analytics-dept-table" class="an-table-wrap"></div>
  </div>

  <!-- Row 4: รายรอบอบรม -->
  <div class="card an-card">
    <div class="card-title an-title"><i class="ti ti-calendar-stats"></i>ผลแต่ละรอบอบรม (ลงทะเบียน · เข้าอบรม · ที่นั่ง)</div>
    <div style="position:relative;height:280px;"><canvas id="chart-by-sess"></canvas></div>
  </div>

  <!-- Row 5: วิทยากร + ผลสอบ -->
  <div class="an-row">
    <div class="card an-card">
      <div class="card-title an-title"><i class="ti ti-presentation"></i>ผลงานรายวิทยากร</div>
      <div id="analytics-trainer" class="an-table-wrap"></div>
    </div>
    <div class="card an-card">
      <div class="an-card-head">
        <div class="card-title"><i class="ti ti-certificate"></i>ผลการทดสอบหลังอบรม</div>
        <span id="analytics-quiz-note" class="an-head-note"></span>
      </div>
      <div id="analytics-quiz" class="an-table-wrap"></div>
    </div>
  </div>

  <!-- Row 6: Departments not registered -->
  <div class="card" style="padding:18px;margin-bottom:16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
      <div class="card-title" style="font-size:13px;margin-bottom:0;"><i class="ti ti-building-community"></i>สถานะการลงทะเบียนตามหน่วยงาน</div>
    </div>
    <div id="analytics-noreg-list"></div>
  </div>
</div>

<!-- ═══ ADMIN ═══ -->
<!-- เมนู "ระบบอบรม" ของ Backoffice (?view=overview) — renderOverview() · ภาพรวมทุกโครงการ + ตั้งค่ากลางที่ใช้ร่วมทุกโครงการ -->
<div class="page" id="page-overview">
  <div class="tqa-subtabs" id="ov-tabs">
    <button class="tqa-subtab active" data-t="overview" onclick="ovTab('overview')"><i class="ti ti-chart-bar"></i>ภาพรวมผลการอบรม</button>

    <p>ระบบรองรับหลายโครงการในลิงก์เดียวกัน โดยใช้ parameter <code>?site=รหัสโครงการ</code> ใน URL — รหัสโครงการ = รหัส รพ.-ลำดับ (ระบบตั้งให้ตอนเปิดอบรม) รพ. เดียวมีได้หลายโครงการ ข้อมูลแยกกันทั้งหมด</p>

    <div class="callout info">

      <div class="callout-body">

        <code>/training/?site=10700-02</code> → โครงการที่ 2 ของ รพ. เดียวกัน<br>
        <code>/training/?page=survey&amp;site=10700-01</code> → แบบประเมินของโครงการนั้น
      </div>
    </div>

    <p>เมื่อกำหนด <code>?site=</code> ระบบจะกรองแสดงเฉพาะหลักสูตร รอบอบรม และผู้ลงทะเบียนของโครงการนั้นโดยอัตโนมัติ รวมถึงดึงชื่อสถานพยาบาลมากรอกในเอกสารอัตโนมัติ</p>

  </section>

  <!-- ═══ ADMIN QUIZ ═══ -->
  <section id="admin-quiz">
    <h2>🧩 แบบทดสอบหลังอบรม (ผู้ดูแล)</h2>
    <p>เมนู <strong>แบบทดสอบ</strong> — แบบทดสอบอยู่ใน <strong>คลังกลาง</strong> ใช้ร่วมทุกโครงการ · หลักสูตรอบรมของแต่ละโครงการเลือกชุดที่ใช้ ข้อสอบสุ่มจากคลังของชุดนั้น</p>

    <div class="tab-list">
      <span class="tab-pill">📋 แบบทดสอบ</span>
      <span class="tab-pill">📑 ผลสอบ &amp; ใบประกาศ</span>
      <span class="tab-pill">⚙️ ตั้งค่าใบประกาศ &amp; อีเมล</span>
    </div>

    <h3>แบบทดสอบ</h3>
    <ul>
      <li><strong>ใช้ในโครงการนี้</strong> — เลือกแบบทดสอบจากคลังกลางให้แต่ละหลักสูตรอบรม · เปิด/ปิดสอบ (มีผลเฉพาะโครงการนี้) · คัดลอกลิงก์สอบส่งให้ผู้เข้าอบรม</li>
      <li><strong>คลังแบบทดสอบกลาง</strong> — สร้างชุด · ตั้งจำนวนข้อที่สุ่ม เกณฑ์ผ่าน เวลา จำนวนครั้งที่สอบได้ · ดูว่าชุดไหนใช้อยู่กี่โครงการ · คัดลอกเป็นชุดใหม่เพื่อปรับเฉพาะบาง รพ.</li>
      <li>คลังข้อสอบ: เพิ่ม/แก้ไข/ปิดใช้ทีละข้อ · <strong>AI ร่างข้อสอบ</strong> จากเนื้อหาที่วาง (ตรวจและเลือกก่อนเพิ่ม) · นำเข้า/ส่งออก Excel</li>
      <li>แก้คลังกลางได้เฉพาะ Admin หรือผู้มีสิทธิ์ <strong>แก้ไข</strong> ของเมนูอบรม (แก้แล้วมีผลทุกโครงการที่ใช้ชุดนั้น)</li>
      <li>ข้อที่มีผู้สอบแล้ว แก้คำถาม/ตัวเลือก/เฉลย = ระบบปิดข้อเดิมแล้วเพิ่มเป็นข้อใหม่ · ลบ = ปิดข้อ — ผลสอบเก่ายังตรงกับข้อที่สอบจริง</li>
      <li>ชุดที่มีผู้สอบแล้วลบไม่ได้ ให้ปิดใช้งานแทน</li>
    </ul>

    <h3>ผลสอบ &amp; ใบประกาศ</h3>
    <ul>
      <li>ผลรายคนของโครงการนี้ กรองตามแบบทดสอบ/ผล/ส่งอีเมลไม่สำเร็จ · Export Excel (สิทธิ์สอบ/สอบผ่าน นับแยกตามโครงการ)</li>
      <li>ส่งใบประกาศทางอีเมลอีกครั้ง (แก้อีเมลได้) · ยกเลิก/คืนสถานะใบประกาศ · ลบผลสอบ (คืนสิทธิ์สอบ 1 ครั้ง)</li>
    </ul>

    <h3>ตั้งค่าใบประกาศ &amp; อีเมล</h3>
    <ul>
      <li>ชื่อหน่วยงาน หัวข้อ สี ผู้ลงนาม รหัสนำหน้าเลขที่ — ดูตัวอย่างใบประกาศได้ทันที</li>
      <li>บัญชีส่งอีเมล EmailJS (Service ID / Template ID / Public Key) พร้อมปุ่มทดสอบส่ง</li>
    </ul>

    <div class="callout info">
      <span class="callout-icon">🔒</span>
      <div class="callout-body">
        <div class="callout-title">เฉลยปลอดภัย</div>
        เฉลยไม่ถูกส่งไปที่หน้าผู้สอบ — ระบบตรวจคะแนนและออกเลขที่ใบประกาศในฐานข้อมูล
      </div>
    </div>
  </section>

  <!-- ═══ ADMIN PRINT ═══ -->
  <section id="admin-print">
    <h2>🖨️ พิมพ์เอกสาร</h2>
    <p>เมนู <strong>🖨️ พิมพ์เอกสาร</strong> (เมนูซ้ายของแท็บอบรมของโครงการ กลุ่ม "งานอบรม") — สร้างและพิมพ์ใบเซ็นชื่อผู้เข้าอบรม</p>

    <h3>ตั้งค่าเอกสาร</h3>

    <h4>หัวข้อเอกสาร</h4>
    <ul>
      <li>เลือกจาก Dropdown รายการที่บันทึกไว้ หรือพิมพ์หัวข้อเองในช่อง Textarea</li>
      <li>กด <strong>"จัดการหัวข้อ"</strong> เพื่อเพิ่ม/แก้ไข/ลบ รายการ Dropdown</li>
    </ul>

    <h4>ข้อมูลเอกสาร</h4>
    <table class="tbl">
      <thead><tr><th>ฟิลด์</th><th>หมายเหตุ</th></tr></thead>
      <tbody>
        <tr><td>สถานพยาบาล</td><td>เลือกโครงการ — ชื่อจะถูกดึงอัตโนมัติ</td></tr>
        <tr><td>วันที่</td><td>วันที่ในเอกสาร</td></tr>
        <tr><td>จำนวนแถว</td><td>เลือกจากตัวเลือก 25 / 50 / 75 / 100 แถว (แต่ละแถวคือ 1 ช่องเซ็นชื่อ)</td></tr>
        <tr><td>แสดงช่องเจ้าหน้าที่</td><td>เพิ่มคอลัมน์ชื่อเจ้าหน้าที่ BMS</td></tr>
      </tbody>
    </table>

    <h4>ผู้ลงนาม</h4>
    <ul>
      <li><strong>ซ้าย (BMS)</strong> — ชื่อ, ตำแหน่งของผู้แทน BMS</li>
      <li><strong>ขวา (สถานพยาบาล)</strong> — ชื่อ, ตำแหน่ง, ชื่อโรงพยาบาล (ดึงจากโครงการอัตโนมัติ)</li>
      <li>กด <strong>"บันทึกเป็นค่าเริ่มต้น"</strong> เพื่อจำค่าผู้ลงนามไว้ใช้ครั้งหน้า</li>
    </ul>

    <h3>พิมพ์</h3>
    <p>ด้านขวาแสดง <strong>ตัวอย่างเอกสาร</strong> แบบ Real-time กด <strong>"พิมพ์เอกสาร"</strong> มุมขวาบนเพื่อสั่งพิมพ์ออกเครื่องพิมพ์ รองรับกระดาษ A4</p>

    <div class="callout info">
      <span class="callout-icon">💡</span>
      <div class="callout-body">
        <div class="callout-title">หลายหน้า</div>
        หากมีแถวมากกว่า 1 หน้ากระดาษ ระบบจะแสดงหมายเลขหน้า <strong>หน้า 1/2</strong>, <strong>หน้า 2/2</strong> โดยอัตโนมัติ หากมีเพียง 1 หน้า จะไม่แสดงหมายเลขหน้า
      </div>
    </div>

    <h3>พิมพ์แบบฟอร์มจาก Tab ผู้ลงทะเบียน</h3>
    <p>ใน Tab <strong>ผู้ลงทะเบียน</strong> → กดปุ่ม <strong>"พิมพ์แบบฟอร์ม"</strong> → กรอกข้อมูลในหน้าต่างที่เปิดขึ้น ชื่อสถานพยาบาลจะถูกดึงจากโครงการปัจจุบันอัตโนมัติ</p>
    <p>สามารถกด <strong>"จำค่าเริ่มต้นผู้ลงนาม"</strong> เพื่อบันทึกชื่อ/ตำแหน่งผู้ลงนามฝั่ง BMS และฝั่งโรงพยาบาลไว้ใช้ครั้งถัดไป โดยจำแยกเป็นรายโครงการ</p>
  </section>
