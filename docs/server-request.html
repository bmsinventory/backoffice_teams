<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ขอใช้งานทีม Server</title>
<meta name="theme-color" content="#0b1e3a">
<link rel="icon" type="image/png" href="img/icon_app.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  :root{
    --bg:#eef3f8; --surface:#ffffff; --surface2:#f5f8fb; --ink:#0f1a2b; --ink2:#4d5a70; --ink3:#8792a5;
    --line:#e1e7ef; --line2:#cfd8e4;
    --accent:#0ea5c6; --accent2:#6366f1; --accent-soft:rgba(14,165,198,.10);
    --grad:linear-gradient(120deg,#0ea5c6 0%,#3b82f6 55%,#6366f1 100%);
    --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
    --shadow:0 1px 2px rgba(15,26,43,.04),0 8px 24px -12px rgba(15,26,43,.12);
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0a0f1a; --surface:#121a29; --surface2:#172133; --ink:#e8edf6; --ink2:#a3afc4; --ink3:#6c7891;
      --line:#223047; --line2:#2d3d58;
      --accent:#38c4e3; --accent2:#818cf8; --accent-soft:rgba(56,196,227,.12);
      --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.disp{font-family:'Prompt','Noto Sans Thai',sans-serif}
  a{color:var(--accent)}
  .hidden{display:none!important}

  /* ── Hero ── */
  .hero{position:relative;overflow:hidden;background:#0b1e3a;color:#fff;padding:12px 0 52px}
  .hero::before{content:"";position:absolute;inset:0;background:
      radial-gradient(600px 300px at 15% -10%,rgba(14,165,198,.55),transparent 60%),
      radial-gradient(500px 300px at 95% 10%,rgba(99,102,241,.55),transparent 60%);}
  .hero::after{content:"";position:absolute;inset:0;opacity:.18;background-image:
      linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px);
      background-size:28px 28px;mask-image:linear-gradient(180deg,#000,transparent 85%)}
  .hero-in{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:0 20px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;opacity:.95}
  .brand img{width:30px;height:30px;border-radius:8px;background:#fff;padding:2px}
  .hero h1{font-size:clamp(19px,2vw,23px);margin:10px 0 2px;line-height:1.3;letter-spacing:-.01em}
  .hero p{margin:0;color:rgba(255,255,255,.78);font-size:13.5px;max-width:640px}
  .badge-live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);margin-top:10px}
  .badge-live i.dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
  .hero-row{display:flex;align-items:flex-end;gap:24px}
  .hero-t{flex:1;min-width:0}
  .prog{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
  .hero-row .prog{flex:0 1 640px}
  .prog a{flex:1;min-width:120px;text-decoration:none;color:rgba(255,255,255,.7);font-size:12px;display:flex;align-items:center;gap:7px;
    padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);transition:.2s}
  .prog a b{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;background:rgba(255,255,255,.15);flex-shrink:0}
  .prog a.done{color:#fff;background:rgba(16,185,129,.18);border-color:rgba(52,211,153,.45)}
  .prog a.done b{background:#10b981}

  /* ── Layout ── */
  .shell{max-width:1440px;margin:-38px auto 0;padding:0 20px 28px;position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start}
  .form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"a d" "c c";gap:14px;align-items:stretch}
  .col{display:flex;flex-direction:column}
  .col-a #sec-2,.col-d #sec-4{flex:1}
  #sec-4 .sec-h h2{flex:1;min-width:0}
  .col-a{grid-area:a} .col-d{grid-area:d} #sec-3{grid-area:c;margin-bottom:0}
  .col>.card:last-child{margin-bottom:0}
  .shell.single{grid-template-columns:minmax(0,680px);justify-content:center}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);scroll-margin-top:16px}
  .sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .sec-n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:'Prompt';font-weight:600;font-size:13px;color:#fff;background:var(--grad);flex-shrink:0;transition:.2s}
  .card.done .sec-n{background:var(--ok)}
  .sec-h h2{font-size:15px;margin:0;line-height:1.3}
  .sec-h small{display:block;color:var(--ink3);font-size:11.5px;font-family:'Noto Sans Thai';font-weight:400}

  /* ── Fields ── */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .fld{display:flex;flex-direction:column;gap:4px;min-width:0}
  .fld>span{font-size:12.5px;font-weight:600;color:var(--ink2)}
  .req{color:var(--bad)}
  .inp{position:relative}
  .inp>i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:16px;pointer-events:none}
  input,textarea{width:100%;font:inherit;font-size:13.5px;padding:8px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s}
  .inp>input{padding-left:34px}
  input::placeholder,textarea::placeholder{color:var(--ink3)}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
  .hint{font-size:11.5px;color:var(--ink3)}
  .invalid{border-color:var(--bad)!important;box-shadow:0 0 0 4px rgba(239,68,68,.14)!important}
  .grp.invalid{border:1.5px solid var(--bad);border-radius:14px;padding:8px}
  @media (max-width:640px){ input,textarea{font-size:16px} }

  .q{margin-top:12px}
  .qrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .qrow .q{margin-top:0}
  .qrow .tiles{grid-template-columns:1fr;grid-auto-rows:minmax(42px,auto)}
  .qrow #g-phase{grid-template-columns:1fr 1fr}
  .q:first-of-type{margin-top:0}
  .q-l{font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .q-l em{font-style:normal;font-weight:500;font-size:11.5px;color:var(--ink3);background:var(--surface2);border:1px solid var(--line);padding:0 8px;border-radius:999px}

  /* ── Option tiles ── */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
  #g-task{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tile{position:relative;display:flex;align-items:center;gap:8px;padding:6px 9px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer;transition:.15s;font-size:13px;user-select:none}
  .tile:hover{border-color:var(--line2);transform:translateY(-1px)}
  .tile input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
  .tile .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface2);color:var(--ink2);font-size:13px;flex-shrink:0;transition:.15s}
  .tile .tx{flex:1;min-width:0;line-height:1.35}
  .tile .ck{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;color:transparent;font-size:13px;flex-shrink:0;transition:.15s}
  .tile.multi .ck{border-radius:6px}
  .tile:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .tile:has(input:checked) .ic{background:var(--grad);color:#fff}
  .tile:has(input:checked) .ck{background:var(--accent);border-color:var(--accent);color:#fff}
  .tile:has(input:focus-visible){box-shadow:0 0 0 4px var(--accent-soft)}
  .tile.other{grid-column:1/-1}
  .tile.other .tx{flex:0 0 auto}

  .tile.other input[type=text]{position:static;flex:1;width:auto;height:auto;opacity:1;pointer-events:auto;padding:5px 10px;border-radius:8px;font-size:13px}

  /* ── Headcount stepper ── */
  .stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:11px;background:var(--surface2);overflow:hidden}
  .stepper button{width:36px;height:36px;border:none;background:transparent;color:var(--ink2);font-size:18px;cursor:pointer}
  .stepper button:hover{background:var(--accent-soft);color:var(--accent)}
  .stepper input{width:44px;border:none;background:transparent;text-align:center;font-family:'Prompt';font-weight:600;font-size:15px;padding:0;-moz-appearance:textfield}
  .stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
  .stepper input:focus{box-shadow:none}
  .hc-row{display:flex;align-items:center;gap:8px;flex-shrink:0}

  /* ── Calendar ── */
  .cal-top{display:flex;align-items:center;gap:6px;margin:0 0 6px}
  .cal-top b{flex:1;font-family:'Prompt';font-weight:600;font-size:14px}
  .icon-btn:disabled{opacity:.35;cursor:default}
  .icon-btn{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;display:grid;place-items:center;font-size:17px}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;user-select:none}
  .cal-h{text-align:center;font-size:11.5px;font-weight:600;color:var(--ink3);padding-bottom:2px}
  .cal-d{position:relative;border-radius:8px;padding:3px 7px 6px;min-height:34px;cursor:pointer;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:2px;background:var(--surface2);border:1.5px solid transparent;transition:transform .12s,border-color .12s}
  .cal-d:hover:not(.past){border-color:var(--line2);transform:translateY(-1px)}
  .cal-d small{font-size:11px;color:var(--ink2);font-weight:500}
  .cal-d b{font-family:'Prompt';font-size:14px;line-height:1.1}
  .cal-d b u{text-decoration:none;font-size:11px;font-weight:500;color:var(--ink3);margin-left:1px}
  .cal-d .bar{position:absolute;left:7px;right:7px;bottom:3px;height:2px;border-radius:3px;background:var(--line)}
  .cal-d .bar i{display:block;height:100%;border-radius:3px;background:currentColor}
  .cal-d.ok{color:var(--ok)} .cal-d.low{color:var(--warn)} .cal-d.none{color:var(--bad)}
  .cal-d.ok b,.cal-d.low b,.cal-d.none b{color:inherit}
  .cal-d.off{background:transparent;border:1.5px dashed var(--line)}
  .cal-d.off small{color:var(--ink3)}
  .cal-d.past{opacity:.35;cursor:not-allowed;background:transparent}
  .cal-d.pad{visibility:hidden;cursor:default}
  .cal-d.today small::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:3px;vertical-align:middle}
  .cal-d.in{background:var(--accent-soft);border-color:rgba(14,165,198,.35)}
  .cal-d.edge{background:var(--grad);border-color:transparent;box-shadow:0 6px 16px -6px rgba(59,130,246,.6)}
  .cal-d.edge small,.cal-d.edge b,.cal-d.edge b u{color:#fff!important}
  .cal-d.edge .bar{background:rgba(255,255,255,.3)} .cal-d.edge .bar i{background:#fff}
  .legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:11.5px;color:var(--ink2);margin-top:8px}
  .cal-foot details.mdate{margin:0 0 0 auto}
  .cal-foot details.mdate[open]{flex-basis:100%;margin:0}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:3px}
  .manual{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  details.mdate{margin-top:12px}
  details.mdate summary{cursor:pointer;font-size:12.5px;color:var(--ink2);list-style:none;display:inline-flex;align-items:center;gap:4px}
  details.mdate summary::-webkit-details-marker{display:none}
  .avail{margin-top:8px;border-radius:10px;padding:6px 10px;font-size:12px;align-items:center;display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line)}
  .avail>i{font-size:17px;margin-top:1px}
  .avail.ok{background:rgba(16,185,129,.09);border-color:rgba(16,185,129,.3)} .avail.ok>i{color:var(--ok)}
  .avail.warn{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.35)} .avail.warn>i{color:var(--warn)}

  /* ── Summary panel (desktop sticky / mobile bottom bar) ── */
  .side{position:sticky;top:16px}
  .sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .sum-h{padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .ring{--p:0;width:40px;height:40px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
    background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
  .ring span{width:31px;height:31px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:'Prompt';font-weight:600;font-size:11.5px}
  .sum-h b{font-family:'Prompt';font-weight:600;font-size:14px;display:block}
  .sum-h small{color:var(--ink3);font-size:11.5px}
  .sum-b{padding:2px 14px}
  .sum-r{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .sum-r:last-child{border-bottom:none}
  .sum-r>i{color:var(--ink3);font-size:15px;margin-top:2px}
  .sum-r div{min-width:0;flex:1}
  .sum-r small{display:block;color:var(--ink3);font-size:11px}
  .sum-r .v{font-weight:600;word-break:break-word}
  .sum-r .v.empty{color:var(--ink3);font-weight:400}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
  .chips span{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
  .sum-f{padding:10px 14px 14px}
  .btn{font:inherit;font-weight:600;cursor:pointer;border:none;border-radius:11px;padding:10px 16px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:.15s}
  .btn-pri{background:var(--grad);color:#fff;box-shadow:0 10px 24px -10px rgba(59,130,246,.7)}
  .btn-pri:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .btn-pri:disabled{opacity:.6;cursor:default;transform:none}
  .btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink2)}
  .btn-sm{min-height:36px;padding:7px 14px;font-size:13px;border-radius:11px}
  .w100{width:100%}
  .note{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:8px}
  .msg{margin-top:10px;font-size:13px;border-radius:12px;padding:10px 12px}
  .msg.err{background:rgba(239,68,68,.1);color:var(--bad)}
  .m-bar{display:none}

  /* ── ค้นหาและติดตามคำขอ ── */
  .track-lookup{grid-column:1/-1;margin:0;padding:12px 14px;position:relative;z-index:3}
  .lookup-main{display:flex;align-items:center;gap:12px}
  .lookup-title{display:flex;align-items:center;gap:10px;min-width:205px}
  .lookup-title>i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--grad);color:#fff;font-size:18px;box-shadow:0 8px 18px -10px rgba(59,130,246,.8)}
  .lookup-title span{display:flex;flex-direction:column;line-height:1.35}
  .lookup-title b{font-family:'Prompt','Noto Sans Thai',sans-serif;font-size:13.5px}
  .lookup-title small{color:var(--ink3);font-size:11px}
  .lookup-field{position:relative;display:flex;align-items:center;flex:1;min-width:0}
  .lookup-field>i{position:absolute;left:12px;color:var(--ink3);font-size:17px;pointer-events:none}
  .lookup-field input{padding-left:38px;padding-right:42px;background:var(--surface2)}
  .lookup-clear{position:absolute;right:5px;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--ink3);cursor:pointer;display:none;place-items:center;font-size:16px}
  .lookup-clear:hover{background:var(--accent-soft);color:var(--accent)}
  .lookup-clear.show{display:grid}
  .lookup-results{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .lookup-results.show{display:block}
  .lookup-state{display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;color:var(--ink3);font-size:12.5px;text-align:center}
  .lookup-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;align-items:start}
  .lookup-group{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:var(--surface2)}
  .lookup-group-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:9px;padding:9px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
  .lookup-group-head>i{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:16px}
  .lookup-group-head b{min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lookup-group-head em{font-style:normal;font-size:10.5px;font-weight:600;white-space:nowrap;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
  .lookup-group-list{display:flex;flex-direction:column}
  .lookup-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);text-decoration:none;color:var(--ink);transition:.15s}
  .lookup-item:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
  .lookup-item>i{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:var(--surface);color:var(--accent);font-size:16px}
  .lookup-item>span{display:flex;flex-direction:column;min-width:0;line-height:1.4}
  .lookup-item b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lookup-item small{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lookup-item em{font-style:normal;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .lookup-group .lookup-item{border:0;border-radius:0;background:transparent}
  .lookup-group .lookup-item+.lookup-item{border-top:1px solid var(--line)}
  .lookup-group .lookup-item:hover{background:var(--accent-soft);transform:none}
  .lookup-count{margin-bottom:7px;font-size:11.5px;color:var(--ink3)}

  @media (max-width:1200px){
    .form-grid{grid-template-columns:1fr;grid-template-areas:"a" "c" "d"}
    #sec-3{margin-bottom:0}
    #g-task{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
    .hero-row{display:block}
  }
  @media (max-width:980px){
    .shell{grid-template-columns:1fr;padding-bottom:120px}
    .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;padding:0}
    .sum{border-radius:18px 18px 0 0;border-bottom:none;box-shadow:0 -10px 30px -10px rgba(15,26,43,.25)}
    .sum-h,.sum-b,.note{display:none}
    .sum-f{padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center}
    .m-bar{display:flex;flex-direction:column;flex:1;min-width:0;font-size:12px;color:var(--ink2)}

  /* ── Success / tracking ── */

  /* เนื้อหา */

  .kv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .kv{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);min-width:0}
  .kv>i{grid-row:span 2;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:var(--accent-soft);color:var(--accent)}

<body>
<header class="hero"><div class="hero-in">
  <div class="brand"><img src="img/icon_app.png" alt="">BMS Backoffice · Server Team</div>
  <div id="hero"></div>
</div></header>
<main class="shell single" id="app"><div class="card">กำลังโหลด...</div></main>

<script src="env-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="src/config/server-request.config.js"></script>
<script>
(function () {
  var app = document.getElementById('app'), hero = document.getElementById('hero');
  var db;
  try { db = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY); }
  catch (e) { app.innerHTML = '<div class="card banner err">เชื่อมต่อระบบไม่ได้ กรุณาลองใหม่ภายหลัง</div>'; return; }

  var qs = new URLSearchParams(location.search);
  var token = qs.get('t') || '';
  var MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var MONF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fd(s) { if (!s) return '-'; var p = String(s).slice(0, 10).split('-'); return Number(p[2]) + ' ' + MON[Number(p[1]) - 1] + ' ' + String(Number(p[0]) + 543).slice(2); }
  function fdt(s) { if (!s) return '-'; try { return new Intl.DateTimeFormat('th-TH', { timeZone: 'Asia/Bangkok', day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(s)) + ' น.'; } catch (_) { return fd(s); } }
  function range(s, e) { return s === e ? fd(s) : fd(s) + ' – ' + fd(e); }
  function iso(d) { return window.srvIso(d); }
  function addDays(s, n) { var d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); }
  function nDays(s, e) { return Math.round((new Date(e) - new Date(s)) / 864e5) + 1; }
  function token40() { var a = new Uint8Array(20); crypto.getRandomValues(a); return Array.from(a, function (b) { return b.toString(16).padStart(2, '0'); }).join(''); }
  function rows(r) { if (r.error) throw r.error; return r.data || []; }
  function $(id) { return document.getElementById(id); }

  var CFG = {}, NOTIFY = '', OPTS = [], HOSP = [], STAFF = [];
  var TODAY = iso(new Date());

  async function loadBase() {
    var res = await Promise.all([
      db.from('settings').select('srv_req_config,notify_server_token').eq('id', 'app').limit(1),
      db.from('server_request_options').select('id,kind,label,sort,active').order('sort'),
    ]);
    var st = rows(res[0])[0] || {};
    CFG = st.srv_req_config || {};
    NOTIFY = st.notify_server_token || '';
    OPTS = rows(res[1]);
  }
  function lab(id) { var o = OPTS.find(function (x) { return x.id === id; }); return o ? o.label : ''; }

  function notify(content) {
    if (!NOTIFY) return;
    fetch((window.NOTIFY_PROXY_URL || '').trim() || 'https://api-notify.bmscloud.in.th/api/v1/push-notify', {
      method: 'POST', headers: { 'Token': NOTIFY, 'Content-Type': 'application/json' }, body: JSON.stringify({ content: content, receiver: null })
    }).catch(function () {});
  }

  // ══ ติดตามสถานะ (?t=token) ══
  async function renderTrack() {
    document.body.classList.add('track-page');
    app.className = 'shell single track-shell';
    var r = rows(await db.from('server_requests').select('*').eq('access_token', token).limit(1))[0];
    if (!r) {
      hero.innerHTML = '<h1>ไม่พบคำขอ</h1><p>ลิงก์อาจไม่ถูกต้อง หรือคำขอถูกลบแล้ว</p>';
      app.innerHTML = '<div class="card center"><a class="btn btn-pri" href="server-request.html"><i class="ti ti-plus"></i>ส่งคำขอใหม่</a></div>';
      return;
    }
    var actorIds = [r.decided_by, r.assigned_by].filter(Boolean);
    var lookup = await Promise.all([
      r.hospital_id ? db.from('hospitals').select('name').eq('id', r.hospital_id).limit(1) : Promise.resolve({ data: [] }),
      ((r.assignees || []).length || actorIds.length) ? db.from('staff').select('id,staff_id,full_name,nickname,phone') : Promise.resolve({ data: [] }),
      actorIds.length ? db.from('users').select('id,user_id,username,name,display_name,staff_id') : Promise.resolve({ data: [] }),
    ]);
    var hosp = rows(lookup[0])[0] || null;
    var hospName = hosp ? hosp.name : r.hospital_name;
    var sids = (r.assignees || []).map(function (a) { return a.sid; });
    // รหัสพนักงานที่ใช้อ้างอิง = staff_id (ถ้ามี) ไม่งั้น id — เหมือน transform STAFF ในแอป
    var staff = rows(lookup[1]), users = rows(lookup[2]);
    var who = function (sid) { return staff.find(function (x) { return (x.staff_id || x.id) === sid; }) || {}; };
    var actorName = function (uid) {
      if (!uid) return '';
      var u = users.find(function (x) { return (x.user_id || x.id) === uid || x.id === uid; }) || {};
      var s = u.staff_id ? who(u.staff_id) : {};
      return s.full_name || u.name || u.display_name || u.username || '';
    };
    var m = window.SRV_STATUS[r.status] || { label: r.status, color: '#8a90a0', icon: 'circle' };
    var flow = ['pending', 'approved', 'scheduled', 'done'], idx = flow.indexOf(r.status);
    var tasks = (r.task_ids || []).map(lab).filter(Boolean); if (r.task_other) tasks.push('อื่นๆ: ' + r.task_other);
    var approverName = actorName(r.decided_by);
    var assignerName = actorName(r.assigned_by);
    var secH = function (icon, title, extra) { return '<div class="sec-h"><div class="sec-n"><i class="ti ti-' + icon + '"></i></div><h2>' + title + (extra ? ' <small>' + extra + '</small>' : '') + '</h2></div>'; };
    var kv = function (icon, label, value) { return '<div class="kv"><i class="ti ti-' + icon + '"></i><small>' + esc(label) + '</small><b>' + value + '</b></div>'; };
    var person = function (icon, label, name, sub) {
      return '<div class="pp"><i class="ti ti-' + icon + '"></i><span><small>' + esc(label) + '</small><b>' + (name || '-') + '</b>' + (sub ? '<em>' + sub + '</em>' : '') + '</span></div>';
    };
    // ไทม์ไลน์: แต่ละขั้นมีเวลา + ผู้ดำเนินการ
    var stepInfo = [
      ['send', 'ส่งคำขอ', r.created_at, r.requester_name],
      ['circle-check', 'อนุมัติ', r.decided_at, approverName],
      ['users-plus', 'จัดคน', r.assigned_at, assignerName],
      ['flag', 'เสร็จสิ้น', r.status === 'done' ? r.updated_at : '', ''],
    ];
    var stepsHtml = idx >= 0 ? '<ol class="steps">' + stepInfo.map(function (s, i) {
      var cls = i < idx || r.status === 'done' ? 'on' : i === idx ? 'on cur' : '';
      return '<li class="' + cls + '"><b><i class="ti ti-' + (cls ? s[0] : 'circle-dashed') + '"></i></b><span>' + s[1] + '</span>'

    var l = String(label).toLowerCase();
    if (/zoom|online|ออนไลน์|teams|meet/.test(l)) return 'video';

    if (/backup|สำรอง/.test(l)) return 'database-export';
    if (/อบรม|train/.test(l)) return 'school';
    if (/slave|replica/.test(l)) return 'copy';
    if (/log/.test(l)) return 'file-text';
    if (/image|ภาพ/.test(l)) return 'photo';
    if (/ut|sit|ทดสอบ|test/.test(l)) return 'checklist';
    if (/ขึ้นระบบ|go.?live/.test(l)) return 'rocket';
    if (kind === 'db_type') return 'database';
    if (kind === 'phase') return 'flag';
    if (kind === 'task') return 'server-2';
    return 'circle-dot';
  }
  function tilesHtml(kind, multi) {
    return OPTS.filter(function (o) { return o.kind === kind && o.active !== false; }).map(function (o) {

  }

  var _lookupTimer = 0, _lookupSeq = 0;
  function bindLookup() {
    var q = $('lookup-q'), clear = $('lookup-clear');
    if (!q || !clear) return;
    q.oninput = function () {
      clear.classList.toggle('show', !!q.value);
      clearTimeout(_lookupTimer);
      var term = q.value.trim();
      if (term.length < 2) { _lookupSeq++; showLookupState(term ? 'พิมพ์อย่างน้อย 2 ตัวอักษรเพื่อค้นหา' : '', false); return; }
      _lookupTimer = setTimeout(function () { searchRequests(term); }, 320);
    };
    clear.onclick = function () { q.value = ''; q.oninput(); q.focus(); };
  }
  function showLookupState(message, loading) {
    var box = $('lookup-results');
    if (!box) return;
    box.classList.toggle('show', !!message);
    box.innerHTML = message ? '<div class="lookup-state">' + (loading ? '<i class="ti ti-loader-2"></i>' : '<i class="ti ti-info-circle"></i>') + esc(message) + '</div>' : '';
  }
  async function searchRequests(term) {
    var seq = ++_lookupSeq;
    showLookupState('กำลังค้นหาคำขอ...', true);
    try {
      var cleaned = term.replace(/[%_*]/g, '').trim();
      if (cleaned.length < 2) { showLookupState('พิมพ์อย่างน้อย 2 ตัวอักษรเพื่อค้นหา', false); return; }
      var pattern = '%' + cleaned + '%';
      var fields = 'req_no,access_token,requester_name,hospital_name,start_date,end_date,status,created_at';
      var found = await Promise.all([
        db.from('server_requests').select(fields).neq('access_token', '').ilike('hospital_name', pattern).order('created_at', { ascending: false }).limit(12),
        db.from('server_requests').select(fields).neq('access_token', '').ilike('requester_name', pattern).order('created_at', { ascending: false }).limit(12),
      ]);
      if (seq !== _lookupSeq) return;
      var byId = {};
      rows(found[0]).concat(rows(found[1])).forEach(function (r) { byId[r.req_no || r.access_token] = r; });
      var list = Object.keys(byId).map(function (k) { return byId[k]; }).sort(function (a, b) { return String(b.created_at).localeCompare(String(a.created_at)); }).slice(0, 12);
      renderLookupResults(list);
    } catch (e) {
      console.error(e);
      if (seq === _lookupSeq) showLookupState('ค้นหาไม่สำเร็จ กรุณาลองใหม่อีกครั้ง', false);
    }
  }
  function renderLookupResults(list) {
    var box = $('lookup-results');
    if (!box) return;
    box.classList.add('show');
    if (!list.length) { box.innerHTML = '<div class="lookup-state"><i class="ti ti-search-off"></i>ไม่พบคำขอจากชื่อโรงพยาบาลหรือชื่อผู้แจ้งนี้</div>'; return; }
    var groups = [], byHospital = {};
    list.forEach(function (r) {
      var hospital = String(r.hospital_name || '').trim() || 'ไม่ระบุโรงพยาบาล';
      var key = hospital.toLocaleLowerCase('th-TH');
      if (!byHospital[key]) {
        byHospital[key] = { hospital: hospital, requests: [] };
        groups.push(byHospital[key]);
      }
      byHospital[key].requests.push(r);
    });
    box.innerHTML = '<div class="lookup-count">พบ ' + list.length + ' คำขอ · ' + groups.length + ' โรงพยาบาล · เลือกรายการเพื่อเปิดหน้าติดตาม</div><div class="lookup-groups">'
      + groups.map(function (group) {
        return '<section class="lookup-group"><div class="lookup-group-head"><i class="ti ti-building-hospital"></i><b title="' + esc(group.hospital) + '">' + esc(group.hospital) + '</b>'
          + '<em>' + group.requests.length + ' คำขอ</em></div><div class="lookup-group-list">'
          + group.requests.map(function (r) {
            var st = window.SRV_STATUS[r.status] || { label: r.status || '-', color: '#8a90a0' };
            var dates = r.start_date && r.end_date ? range(r.start_date, r.end_date) : '-';
            return '<a class="lookup-item" href="server-request.html?t=' + encodeURIComponent(r.access_token || '') + '"><i class="ti ti-file-description"></i><span>'
              + '<b>' + esc(r.req_no || '-') + ' · ' + esc(r.requester_name || '-') + '</b><small>' + esc(dates) + '</small></span>'
              + '<em style="color:' + st.color + ';background:' + st.color + '1f">' + esc(st.label) + '</em></a>';
          }).join('') + '</div></section>';
      }).join('') + '</div>';
  }

      + '<div class="sum-h"><div class="ring" id="ring"><span id="ring-t">0/4</span></div><div><b>สรุปคำขอ</b><small id="sum-sub">กรอกให้ครบ 4 ขั้นตอนเพื่อส่ง</small></div></div>'
      + '<div class="sum-b" id="sum-b"></div>'
      + '<div class="sum-f"><div class="m-bar"><span id="m-prog">0/4 ขั้นตอน</span><b id="m-sum">ยังไม่ได้เลือกวันที่</b></div>'
      + '<button class="btn btn-pri w100" id="f-send"><i class="ti ti-send"></i>ส่งคำขอ</button>'
      + '<div id="form-msg"></div>'
      + '<div class="note">ส่งแล้วจะได้ลิงก์ติดตามผลการอนุมัติ</div></div>'
      + '</div></aside>';

    $('f-s').onchange = function () { _sel.s = this.value; if (_sel.e && _sel.e < _sel.s) _sel.e = _sel.s; syncDates(); };
    $('f-e').onchange = function () { _sel.e = this.value; if (_sel.s && _sel.e < _sel.s) _sel.s = _sel.e; if (!_sel.s) _sel.s = _sel.e; syncDates(); };
    $('f-hc').oninput = function () { drawCal(); availMsg(); update(); };
    app.querySelectorAll('[data-hc]').forEach(function (b) {
      b.onclick = function () { var i = $('f-hc'); i.value = Math.min(20, Math.max(1, headcount() + Number(b.dataset.hc))); i.oninput(); };
    });
    $('f-task-oth').oninput = function () { $('f-task-oth-ck').checked = !!this.value.trim(); update(); };
    var clearInv = function (e) { var x = e.target.closest && e.target.closest('.invalid'); if (x) x.classList.remove('invalid'); update(); };
    $('form').addEventListener('input', clearInv);
    $('form').addEventListener('change', clearInv);
    $('f-send').onclick = submit;
    bindLookup();
    if (hasCal) { _calMonth = TODAY.slice(0, 7); drawCal(); }
    update();
  }

  function headcount() { return Math.max(1, parseInt($('f-hc').value, 10) || 1); }
  function val(id) { var e = $(id); return e ? e.value.trim() : ''; }
  function picked(name) { return Array.from(document.querySelectorAll('input[name="' + name + '"]:checked')).map(function (x) { return x.value; }); }
  function taskOther() { return $('f-task-oth-ck').checked ? val('f-task-oth') : ''; }
  function kindDone(k) {
    if (!k.required) return true;
    if (k.kind === 'task') return picked('task').length > 0 || !!taskOther();
    if (!document.querySelector('input[name="' + k.kind + '"]')) return true; // Admin ปิดตัวเลือกหมวดนี้หมด → ไม่บังคับ
    return picked(k.kind).length > 0;
  }
  function stepState() {
    return [
      !!val('f-name'),
      !!(val('f-hosp') && val('f-it-name') && val('f-it-phone')),
      window.SRV_OPTION_KINDS.every(kindDone),
      !!(_sel.s && _sel.e),
    ];
  }

  // ── อัปเดตความคืบหน้า + แผงสรุป ทุกครั้งที่กรอก ──
  function update() {
    var st = stepState(), n = st.filter(Boolean).length;
    st.forEach(function (ok, i) {
      $(STEPS[i][0]).classList.toggle('done', ok);
      var a = document.querySelector('#prog [data-step="' + i + '"]');
      if (a) { a.classList.toggle('done', ok); a.querySelector('b').innerHTML = ok ? '<i class="ti ti-check"></i>' : (i + 1); }
    });
    // กรอกครบส่วนไหนแล้ว ลบกรอบแดง/ข้อความเตือนของส่วนนั้นทันที
    if (st[3]) ['cal', 'f-s', 'f-e'].forEach(function (id) { if ($(id)) $(id).classList.remove('invalid'); });
    if (n === 4) $('form-msg').innerHTML = '';
    var ring = $('ring'); ring.style.setProperty('--p', n * 25); $('ring-t').textContent = n + '/4';
    $('sum-sub').textContent = n === 4 ? 'พร้อมส่งคำขอแล้ว' : 'กรอกให้ครบ 4 ขั้นตอนเพื่อส่ง';
    $('m-prog').textContent = n + '/4 ขั้นตอน' + (n === 4 ? ' · พร้อมส่ง' : '');
    $('m-sum').textContent = _sel.s && _sel.e ? range(_sel.s, _sel.e) + ' · ' + headcount() + ' คน' : (val('f-hosp') || 'ยังไม่ได้เลือกวันที่');

    var tasks = picked('task').map(lab).concat(taskOther() ? ['อื่นๆ: ' + taskOther()] : []);
    var mode = [lab(picked('work_mode')[0]), lab(picked('db_type')[0])].filter(Boolean).join(' · ');
    var item = function (icon, label, v) {
      return '<div class="sum-r"><i class="ti ti-' + icon + '"></i><div><small>' + label + '</small>' + (v || '<span class="v empty">—</span>') + '</div></div>';
    };
    var av = availState();
    $('sum-b').innerHTML =
        item('building-hospital', 'โรงพยาบาล', val('f-hosp') ? '<span class="v">' + esc(val('f-hosp')) + '</span>' : '')
      + item('adjustments', 'รูปแบบงาน', mode ? '<span class="v">' + esc(mode) + '</span>' : '')
      + item('list-check', 'งานที่ขอ', tasks.length ? '<div class="chips">' + tasks.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>' : '')
      + item('calendar-event', 'ช่วงวันที่', _sel.s && _sel.e ? '<span class="v">' + range(_sel.s, _sel.e) + '</span> <span class="hint">(' + nDays(_sel.s, _sel.e) + ' วัน · ' + headcount() + ' คน)</span>'
          + (av ? '<div class="hint" style="color:' + (av.short ? 'var(--warn)' : 'var(--ok)') + ';font-weight:600">' + (av.short ? '⚠ ทีมว่างไม่พอ ' + av.short + ' วัน' : '✓ ทีมว่างพอตลอดช่วง') + '</div>' : '') : '');
  }

  function syncDates() {
    $('f-s').value = _sel.s;
    $('f-e').value = _sel.e;
    // พิมพ์วันที่เองแล้วอยู่นอกเดือนที่แสดง → เลื่อนปฏิทินไปเดือนของวันเริ่ม
    if (_sel.s && _calMonth && _sel.s.slice(0, 7) !== _calMonth && (_sel.e || _sel.s).slice(0, 7) !== _calMonth) _calMonth = _sel.s.slice(0, 7);
    drawCal(); availMsg(); update();
  }
  // เดือนถัดไป/ก่อนหน้า (YYYY-MM) — เลื่อนได้ตั้งแต่เดือนนี้ ถึงเดือนที่ยังมีข้อมูลวันว่าง (120 วัน)
  function shiftMonth(m, n) { var d = new Date(m + '-01T00:00:00'); d.setMonth(d.getMonth() + n); return iso(d).slice(0, 7); }
  window.srvCalNav = function (n) {
    var m = shiftMonth(_calMonth, n);
    if (m < TODAY.slice(0, 7) || m > addDays(TODAY, 120).slice(0, 7)) return;
    _calMonth = m; drawCal();
  };
  window.srvPick = function (d) {
    if (d < TODAY) return;
    if (!_sel.s || _sel.e) { _sel.s = d; _sel.e = ''; }
    else if (d < _sel.s) { _sel.e = _sel.s; _sel.s = d; }
    else _sel.e = d;
    syncDates();
  };
  function drawCal() {
    var el = $('cal');
    if (!el || !_calMonth) return;
    var hc = headcount(), selEnd = _sel.e || _sel.s;
    var first = _calMonth + '-01', lead = (new Date(first + 'T00:00:00').getDay() + 6) % 7;
    var dim = new Date(Number(_calMonth.slice(0, 4)), Number(_calMonth.slice(5, 7)), 0).getDate();
    var canPrev = _calMonth > TODAY.slice(0, 7), canNext = shiftMonth(_calMonth, 1) <= addDays(TODAY, 120).slice(0, 7);
    var html = '<div class="cal-top"><b>' + MONF[Number(_calMonth.slice(5, 7)) - 1] + ' ' + (Number(_calMonth.slice(0, 4)) + 543) + '</b>'
      + '<button class="icon-btn" type="button" onclick="srvCalNav(-1)" aria-label="เดือนก่อนหน้า"' + (canPrev ? '' : ' disabled') + '><i class="ti ti-chevron-left"></i></button>'
      + '<button class="icon-btn" type="button" onclick="srvCalNav(1)" aria-label="เดือนถัดไป"' + (canNext ? '' : ' disabled') + '><i class="ti ti-chevron-right"></i></button></div><div class="cal">'
      + ['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา'].map(function (d) { return '<div class="cal-h">' + d + '</div>'; }).join('');
    for (var p = 0; p < lead; p++) html += '<div class="cal-d pad"></div>';
    for (var i = 0; i < dim; i++) {
      var d = addDays(first, i), x = FREE[d];
      var work = x && !x.holiday && !x.weekend && d >= TODAY;
      var cls = d < TODAY ? 'past' : !work ? 'off' : x.free === 0 ? 'none' : x.free < hc ? 'low' : 'ok';
      if (_sel.s && d >= _sel.s && d <= selEnd) cls += (d === _sel.s || d === selEnd) ? ' edge' : ' in';
      if (d === TODAY) cls += ' today';
      html += '<div class="cal-d ' + cls + '" onclick="srvPick(\'' + d + '\')" title="' + fd(d) + (x ? ' · ว่าง ' + x.free + '/' + x.total + ' คน' : '') + '">'
        + '<small>' + Number(d.slice(8)) + '</small>'
        + (work ? '<b>' + x.free + '<u>/' + x.total + '</u></b><span class="bar"><i style="width:' + Math.round(x.free / Math.max(1, x.total) * 100) + '%"></i></span>'
          : (x && x.holiday && d >= TODAY ? '<small style="margin-top:auto">หยุด</small>' : '')) + '</div>';
    }
    el.innerHTML = html + '</div>';
  }
  // วันทำการในช่วงที่เลือกซึ่งทีมว่างไม่พอ (ส่งได้ แต่ PM อาจเสนอวันใหม่)
  function availState() {
    if (!_sel.s || !_sel.e || !STAFF.length) return null;
    var hc = headcount(), short = [];
    for (var d = _sel.s; d <= _sel.e; d = addDays(d, 1)) {
      var x = FREE[d];
      if (x && !x.holiday && !x.weekend && x.free < hc) short.push(d);
    }
    return { short: short.length, days: short };
  }
  function availMsg() {
    var box = $('avail-msg');
    if (!_sel.s || !_sel.e) { box.innerHTML = ''; return; }
    // บรรทัดเดียวสั้น ๆ (ช่วงวันที่แสดงในแผงสรุปอยู่แล้ว) — การ์ดปฏิทินจะได้ไม่สูงกว่าคอลัมน์ซ้าย
    var head = '<b>' + range(_sel.s, _sel.e) + '</b> (' + nDays(_sel.s, _sel.e) + ' วัน)';
    var a = availState();
    if (!a) box.innerHTML = '<div class="avail"><i class="ti ti-calendar-check"></i><div>' + head + '</div></div>';
    else if (a.short) box.innerHTML = '<div class="avail warn" title="' + a.days.map(fd).join(', ') + '"><i class="ti ti-alert-triangle"></i><div>'
      + 'ทีมว่างไม่ถึง ' + headcount() + ' คน ' + a.short + ' วัน (' + a.days.slice(0, 3).map(function (d) { return Number(d.slice(8)); }).join(', ')
      + (a.short > 3 ? ' …' : '') + ' ' + MON[Number(a.days[0].slice(5, 7)) - 1] + ') · ส่งได้ แต่ PM อาจเสนอวันใหม่</div></div>';
    else box.innerHTML = '<div class="avail ok"><i class="ti ti-circle-check"></i><div>' + head + ' · ทีมว่างพอตลอดช่วง</div></div>';
  }

  async function submit() {
    var msg = $('form-msg');
    msg.innerHTML = '';
    document.querySelectorAll('.invalid').forEach(function (x) { x.classList.remove('invalid'); });
    var miss = [];
    var need = function (ok, el) { if (!ok) { el.classList.add('invalid'); miss.push(el); } };
    ['f-name', 'f-hosp', 'f-it-name', 'f-it-phone'].forEach(function (id) { need(val(id), $(id)); });
    window.SRV_OPTION_KINDS.forEach(function (k) { need(kindDone(k), $('g-' + k.kind)); });
    need(_sel.s && _sel.e, $('f-s'));
    need(_sel.s && _sel.e, $('f-e'));
    if (miss.length) {
      if (!(_sel.s && _sel.e)) { var dt = document.querySelector('details.mdate'); if (dt && !$('cal')) dt.open = true; if ($('cal')) $('cal').classList.add('invalid'); }
      msg.innerHTML = '<div class="msg err">กรุณากรอกข้อมูลที่จำเป็น (มี * สีแดง) ให้ครบ</div>';
      (miss[0].closest('.card') || miss[0]).scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    if (_sel.s < TODAY) { msg.innerHTML = '<div class="msg err">วันที่เริ่มต้นต้องไม่ย้อนหลัง</div>'; return; }

    var btn = $('f-send'); btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i>กำลังส่ง...';
    try {
      var hTxt = val('f-hosp'), taskOth = taskOther();
      var h = HOSP.find(function (x) { return hospOpt(x) === hTxt || x.name === hTxt; });
      var now = new Date();
      var ex = rows(await db.from('server_requests').select('req_no').like('req_no', window.srvReqNoPrefix(now) + '%'));
      var row = {
        id: window.srvUid('SR'), req_no: window.srvNextReqNo(ex.map(function (x) { return x.req_no; }), now), access_token: token40(),
        requester_name: val('f-name'), requester_team: val('f-team'),
        hospital_id: h ? h.id : '', hospital_name: h ? h.name : hTxt, it_name: val('f-it-name'), it_phone: val('f-it-phone'),
        work_mode_id: picked('work_mode')[0] || '', db_type_id: picked('db_type')[0] || '',
        task_ids: picked('task'), task_other: taskOth, phase_id: picked('phase')[0] || '',
        start_date: _sel.s, end_date: _sel.e, headcount: headcount(), note: val('f-note'),
        status: 'pending', created_at: now.toISOString(), updated_at: now.toISOString(),
      };
      var ins = await db.from('server_requests').insert(row);
      if (ins.error) throw ins.error;
      var tasks = row.task_ids.map(lab).concat(taskOth ? ['อื่นๆ: ' + taskOth] : []);
      notify('🖥 **คำขอใช้งานทีม Server ใหม่ — รออนุมัติ**'
        + '\n🧾 เลขที่: **' + row.req_no + '**'
        + '\n👤 ผู้ขอ: ' + row.requester_name + (row.requester_team ? ' (' + row.requester_team + ')' : '')
        + '\n🏥 ' + row.hospital_name
        + '\n📅 ' + range(row.start_date, row.end_date) + ' (' + row.headcount + ' คน)'
        + '\n🛠 ' + tasks.join(', ')
        + '\n🧑‍💻 IT รพ. : ' + row.it_name + ' · ' + row.it_phone
        + '\n[🔗 เปิดลิงค์เพื่ออนุมัติ](https://backoffice-teams.bmscloud.in.th/#server_request=' + row.id + ')');
      renderDone(row);
    } catch (e) {
      console.error(e);
      msg.innerHTML = '<div class="msg err">ส่งคำขอไม่สำเร็จ กรุณาลองใหม่</div>';
      btn.disabled = false; btn.innerHTML = '<i class="ti ti-send"></i>ส่งคำขอ';
    }
  }

  function renderDone(row) {
    document.body.classList.remove('track-page');
    var url = new URL('server-request.html?t=' + encodeURIComponent(row.access_token), location.href).href;
    app.className = 'shell single';
    hero.innerHTML = '<h1>ส่งคำขอเรียบร้อย</h1><p>' + esc(row.hospital_name) + ' · ' + range(row.start_date, row.end_date) + '</p>';
    var tasks = (row.task_ids || []).map(lab).filter(Boolean).concat(row.task_other ? ['อื่นๆ: ' + row.task_other] : []);
    var stepper = [['ti-send', 'ส่งคำขอ', 'เรียบร้อย'], ['ti-user-check', 'DM/PM พิจารณา', 'กำลังดำเนินการ'], ['ti-users-group', 'จัดทีม', 'รอ'], ['ti-flag', 'เข้าดำเนินการ', 'รอ']]
      .map(function (s, i) { return '<li class="' + (i === 0 ? 'ok' : i === 1 ? 'cur' : '') + '"><b><i class="ti ' + (i === 0 ? 'ti-check' : s[0]) + '"></i></b><span>' + s[1] + '<small>' + s[2] + '</small></span></li>'; }).join('');
    app.innerHTML = '<section class="done-card">'
      + '<div class="done-top"><div class="ok-ic"><i class="ti ti-check"></i></div>'
      + '<div><div class="done-eyebrow">ส่งคำขอสำเร็จ</div><h2>รับคำขอแล้ว รอ DM/PM พิจารณา</h2>'
      + '<p>เราจะแจ้งผลผ่านลิงก์ติดตามด้านล่าง พร้อมรายชื่อทีมที่จะเข้าดำเนินการ</p></div>'
      + '<div class="done-no"><small>เลขที่คำขอ</small><b>' + esc(row.req_no) + '</b></div></div>'
      + '<div class="done-body">'
      + '<ol class="tl">' + stepper + '</ol>'
      + '<div class="facts">'
      + '<div><i class="ti ti-building-hospital"></i><small>โรงพยาบาล</small><b>' + esc(row.hospital_name) + '</b></div>'
      + '<div><i class="ti ti-calendar-event"></i><small>ช่วงวันที่</small><b>' + range(row.start_date, row.end_date) + '</b></div>'
      + '<div><i class="ti ti-users"></i><small>จำนวนคน</small><b>' + esc(row.headcount) + ' คน</b></div>'
      + (tasks.length ? '<div class="wide"><i class="ti ti-tool"></i><small>งานที่ขอ</small><span class="chips">' + tasks.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</span></div>' : '')
      + '</div>'
      + '<div class="trk-lbl"><i class="ti ti-bookmark"></i>บันทึกลิงก์นี้ไว้ติดตามสถานะ</div>'
      + '<div class="link-box"><i class="ti ti-link"></i><input id="trk" readonly value="' + esc(url) + '" onclick="this.select()"><button class="btn btn-ghost btn-sm" id="cp" type="button"><i class="ti ti-copy"></i><span>คัดลอก</span></button></div>'
      + '<div class="done-act"><a class="btn btn-pri" href="' + esc(url) + '"><i class="ti ti-radar-2"></i>เปิดหน้าติดตาม</a>'
      + (navigator.share ? '<button class="btn btn-ghost" id="sh" type="button"><i class="ti ti-share"></i>แชร์ลิงก์</button>' : '')
      + '<a class="btn btn-ghost" href="server-request.html"><i class="ti ti-plus"></i>ส่งคำขอใหม่</a></div>'
      + '</div></section>';
    $('cp').onclick = function () {
      var b = this, done = function () { b.classList.add('ok'); b.innerHTML = '<i class="ti ti-check"></i><span>คัดลอกแล้ว</span>'; setTimeout(function () { b.classList.remove('ok'); b.innerHTML = '<i class="ti ti-copy"></i><span>คัดลอก</span>'; }, 2000); };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done);
      else { $('trk').select(); document.execCommand('copy'); done(); }
    };
    if ($('sh')) $('sh').onclick = function () { navigator.share({ title: 'ติดตามคำขอ ' + row.req_no, url: url }).catch(function () {}); };
    window.scrollTo(0, 0);
  }

  (async function init() {
    try {
      await loadBase();
      if (token) { await renderTrack(); return; }
      await loadAvailability();
      renderForm();
    } catch (e) {
      console.error(e);
      app.innerHTML = '<div class="card banner err">โหลดข้อมูลไม่สำเร็จ กรุณาลองใหม่ภายหลัง</div>';
    }
  })();
})();
</script>
</body>
</html>
