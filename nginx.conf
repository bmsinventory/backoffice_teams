server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # generated at container start by docker-entrypoint.sh — never cache
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:png|jpg|jpeg|gif|ico|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # >>> AI PROXY >>>
    # เรียก MedGemma (vLLM) ผ่าน backend เท่านั้น — URL/คีย์จริงมาจาก ENV ตอน container start
    # docker-entrypoint.sh จะ "ตัด" block นี้ออกถ้าไม่ได้ตั้ง VLLM_UPSTREAM (nginx ยังสตาร์ทได้ปกติ)
    location /helpdesk-ai/ {
        proxy_pass ${VLLM_UPSTREAM}/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Bearer ${VLLM_API_KEY}";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        client_max_body_size 4m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        add_header Cache-Control "no-store";
    }
    # <<< AI PROXY <<<

    location / {
        try_files $uri $uri/ /index.html;
    }
}
