# ── Backend เข้าสู่ระบบด้วยใบหน้า (facehub.js) — เบราว์เซอร์เรียก /api/face/* ของเว็บนี้เท่านั้น
# ไฟล์ js เป็นคนเรียก FaceHub พร้อม API key จาก ENV · resolver สร้างตอน start (docker-entrypoint.sh) ──
js_path "/etc/nginx/njs/";
js_import facehub from facehub.js;
js_fetch_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
js_fetch_timeout 30s;
js_fetch_max_response_buffer_size 2m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # บีบอัดโค้ดแอป — เดิม Proxy ข้างหน้าบีบให้เฉพาะ HTML ส่วน JS/CSS ส่งเต็มขนาด (รวม ~2.7 MB) · บีบแล้วเหลือราว 1 ใน 4
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;

    # คำขอข้อมูล (REST) ของหน้าเว็บ → Supabase (env-config.js ส่งมาที่นี่) — ได้ gzip ด้านบน (JSON เหลือราว 1 ใน 5)
    # $db_up มาจาก docker-entrypoint.sh (API_UPSTREAM / SUPABASE_URL) · ใช้ตัวแปร → resolve ตอนใช้งาน ไม่ทำให้ nginx สตาร์ทไม่ขึ้นถ้า DNS มีปัญหา
    location ^~ /db/rest/v1/ {
        include /etc/nginx/snippets/db-upstream.conf;
        rewrite ^/db(/rest/v1/.*)$ $1 break;
        proxy_pass $db_up;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        client_max_body_size 50m;
        proxy_connect_timeout 5s; # ต่อไม่ได้ → 502 เร็ว หน้าเว็บสลับไปต่อตรง (env-config.js)
        proxy_read_timeout 120s;
    }

    # generated at container start by docker-entrypoint.sh — never cache
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    # โค้ดแอป (HTML/JS/CSS/JSON รวม sw.js) — ให้เบราว์เซอร์ถามเซิร์ฟเวอร์ทุกครั้ง (ไฟล์ไม่เปลี่ยนได้ 304 เบา ๆ)
    # ไม่ตั้งไว้ เบราว์เซอร์จะเดาอายุแคชเอง (heuristic) → มือถือ/PWA ใช้โค้ดเก่าค้างได้หลายวันหลังอัปเวอร์ชัน
    location ~* \.(?:html|js|css|json)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:png|jpg|jpeg|gif|ico|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }


    # รูปใบหน้า base64 ต้องอยู่ในหน่วยความจำทั้งก้อน (client_body_buffer_size = client_max_body_size) njs ถึงอ่านได้
    location = /api/face/config   { js_content facehub.config; }
    location = /api/face/status   { js_content facehub.status; }
    location = /api/face/remove   { js_content facehub.remove; }
    location = /api/face/match    { client_max_body_size 3m;  client_body_buffer_size 3m;  js_content facehub.match; }
    location = /api/face/reset    { client_max_body_size 3m;  client_body_buffer_size 3m;  js_content facehub.reset; }
    location = /api/face/register { client_max_body_size 12m; client_body_buffer_size 12m; js_content facehub.register; }
    location /api/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
