# จำกัดคำขอ AI / อ่านออกเสียง (TTS) ต่อ IP — กันยิงถี่จนบริการช้าทั้งองค์กร
limit_req_zone $binary_remote_addr zone=ai:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=tts:1m rate=2r/s;
# บริการภายนอกที่หน้าเว็บเรียกผ่าน backend (แจ้งเตือน / ข้อมูล รพ. / อีเมลใบประกาศ)
limit_req_zone $binary_remote_addr zone=ext:1m rate=5r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # บีบอัดโค้ดแอป — เดิม Proxy ข้างหน้าบีบให้เฉพาะ HTML ส่วน JS/CSS ส่งเต็มขนาด (รวม ~2.7 MB) · บีบแล้วเหลือราว 1 ใน 4
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;

    # คำขอข้อมูล (REST) ของหน้าเว็บ → Supabase (env-config.js ส่งมาที่นี่) — ได้ gzip ด้านบน (JSON เหลือราว 1 ใน 5)
    # $db_up มาจาก docker-entrypoint.sh (API_UPSTREAM / SUPABASE_URL) · ใช้ตัวแปร → resolve ตอนใช้งาน ไม่ทำให้ nginx สตาร์ทไม่ขึ้นถ้า DNS มีปัญหา
    location ^~ /db/rest/v1/ {
        include /etc/nginx/snippets/db-upstream.conf;
        rewrite ^/db(/rest/v1/.*)$ $1 break;
        proxy_pass $db_up;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        client_max_body_size 50m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # AI (vLLM OpenAI-compatible) → src/services/ai.service.js — หน้าเว็บเรียกแค่ /api/ai/v1/... ไม่รู้ที่อยู่บริการจริง
    # เปิดให้เฉพาะ 2 ทางที่ระบบใช้: ดูชื่อโมเดล + ส่งข้อความ
    location ~ ^/api/ai/v1/(models|chat/completions)$ {
        limit_except GET POST { deny all; }
        limit_req zone=ai burst=20 nodelay;
        limit_req_status 429;
        set $ai_up "https://vllm-gemma.bmscloud.in.th";
        proxy_pass $ai_up/v1/$1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_ssl_server_name on;
        client_max_body_size 1m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        add_header Cache-Control "no-store";
    }

    # AI อ่านออกเสียง → VoxCPM TTS (src/services/tts.service.js) — หน้าเว็บเรียกแค่ /api/tts ไม่รู้ที่อยู่บริการจริง
    # body = { input, voice, response_format, speed } ตาม OpenAI /v1/audio/speech · ใช้ตัวแปร → resolve ตอนใช้งาน (resolver จาก docker-entrypoint.sh)
    location = /api/tts {
        limit_except POST { deny all; }
        limit_req zone=tts burst=20 nodelay;
        limit_req_status 429;
        set $tts_up "https://vox-cpm.bmscloud.in.th";
        proxy_pass $tts_up/v1/audio/speech;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_ssl_server_name on;
        client_max_body_size 16k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store";
    }

    # ── บริการภายนอก — หน้าเว็บเรียกผ่าน backend นี้เท่านั้น ไม่เรียกโดเมนภายนอกตรงจากเบราว์เซอร์ (dev-server.js ต้องมีเส้นทางเดียวกัน) ──

    # BMS Notify (แจ้งเตือนกลุ่ม Line) → src/modules/notify.js ฯลฯ · หน้าเว็บส่ง { channel, content } + header x-bo-session
    # → push-worker ใน container นี้ (push-worker/notify-relay.js) อ่าน Token จากฐานข้อมูลแล้วส่งต่อ — เบราว์เซอร์ไม่เห็น Token
    location = /api/notify {
        limit_except POST { deny all; }
        limit_req zone=ext burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        client_max_body_size 64k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 40s;
        add_header Cache-Control "no-store";
    }

    # ข้อมูลสถานพยาบาล สธ. → src/modules/hospital.js (/api/hcode/token/, /api/hcode/health_office/?...)
    # Authorization (Bearer ของบัญชี hcode ที่ผู้ใช้ล็อกอินเอง) ส่งต่อไปตามเดิม
    location ~ ^/api/hcode/(.*)$ {
        limit_except GET POST { deny all; }
        limit_req zone=ext burst=30 nodelay;
        limit_req_status 429;
        set $hcode_up "https://hcode.moph.go.th";
        proxy_pass $hcode_up/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        client_max_body_size 64k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store";
    }

    # EmailJS ส่งอีเมลใบประกาศ → src/utils/trn-cert.util.js
    # Origin / Referer / User-Agent ของเบราว์เซอร์ส่งต่อไปตามเดิม (EmailJS ตรวจโดเมนที่อนุญาต และไม่รับคำขอที่ไม่ใช่เบราว์เซอร์)
    location = /api/emailjs/send {
        limit_except POST { deny all; }
        limit_req zone=ext burst=30 nodelay;
        limit_req_status 429;
        set $emailjs_up "https://api.emailjs.com";
        proxy_pass $emailjs_up/api/v1.0/email/send;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_ssl_server_name on;
        client_max_body_size 256k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    # generated at container start by docker-entrypoint.sh — never cache
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    # โค้ดแอป (HTML/JS/CSS/JSON รวม sw.js) — ให้เบราว์เซอร์ถามเซิร์ฟเวอร์ทุกครั้ง (ไฟล์ไม่เปลี่ยนได้ 304 เบา ๆ)
    # ไม่ตั้งไว้ เบราว์เซอร์จะเดาอายุแคชเอง (heuristic) → มือถือ/PWA ใช้โค้ดเก่าค้างได้หลายวันหลังอัปเวอร์ชัน
    location ~* \.(?:html|js|css|json)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:png|jpg|jpeg|gif|ico|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }


    location / {
        try_files $uri $uri/ /index.html;
    }
}
