server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # generated at container start by docker-entrypoint.sh — never cache
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:png|jpg|jpeg|gif|ico|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }


    location / {
        try_files $uri $uri/ /index.html;
    }
}
