# nginx server block — main app domain → frontend container (deploy/docker-compose.yml, port 8089)
# Copy to /etc/nginx/sites-available/, symlink into sites-enabled, then:
#   certbot --nginx -d app.YOURDOMAIN.com
# certbot rewrites this file in place to add the SSL server block — that's expected.

server {
    listen 80;
    server_name app.YOURDOMAIN.com;

    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
