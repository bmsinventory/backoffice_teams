# nginx server block — Supabase API subdomain → Kong gateway (self-hosted Supabase, port 8000)
# Copy to /etc/nginx/sites-available/, symlink into sites-enabled, then:
#   certbot --nginx -d api.YOURDOMAIN.com
#
# Includes Upgrade/Connection headers because Realtime (used by this app for live sync)
# goes through Kong over a websocket — without these, realtime silently fails to connect.

server {
    listen 80;
    server_name api.YOURDOMAIN.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
